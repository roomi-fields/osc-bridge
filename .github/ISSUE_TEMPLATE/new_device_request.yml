name: "New device request"
description: "Ask for a device to be added to the SynthHub catalogue, or send its driver."
title: "[device] <Vendor> <Model>"
labels: ["device-request"]
body:
  - type: input
    id: vendor
    attributes:
      label: "Vendor"
      placeholder: "e.g. Sequential"
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: "Model"
      placeholder: "e.g. Prophet 5 Rev 4"
    validations:
      required: true
  - type: input
    id: firmware
    attributes:
      label: "Firmware version you target (if known)"
  - type: textarea
    id: source
    attributes:
      label: "Source of the MIDI spec"
      description: "Official PDF / vendor page / pencilresearch CSV / USB sniff. URL preferred."
      placeholder: "https://..."
    validations:
      required: true
  - type: textarea
    id: driver
    attributes:
      label: "Driver file (optional)"
      description: "A driver you wrote (docs/DEVICE_JSON_SCHEMA.md): attach the JSON, or paste it. It goes to the SynthHub catalogue; the submit_driver MCP tool sends it there directly."
  - type: checkboxes
    id: hardware
    attributes:
      label: "Do you own the hardware?"
      options:
        - label: "Yes — I can test the driver on it and report the result (report_result)."
