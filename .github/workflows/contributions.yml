# Merge the driver files agents contributed through the hosted MCP server
# (submit_driver / submit_fix). Every half hour: fetch the pending ones,
# check each (parse, lint, catalogue regenerated, library tests), merge the
# good ones as pull requests and report every verdict back to the server.
# See scripts/apply_contributions.py.
#
# Secrets: OSC_BRIDGE_SYNC_TOKEN (the server's token for /admin/contributions)
# and CONTRIB_TOKEN (a token of the account that opens and merges the pull
# requests, with contents and pull-requests write on this repository). The job
# does nothing until both exist.
name: Agent contributions

on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:

concurrency:
  group: agent-contributions
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  merge:
    runs-on: ubuntu-latest
    env:
      OSC_BRIDGE_SYNC_TOKEN: ${{ secrets.OSC_BRIDGE_SYNC_TOKEN }}
      GH_TOKEN: ${{ secrets.CONTRIB_TOKEN }}
    steps:
      - name: Fetch pending contributions
        id: fetch
        run: |
          if [ -z "$OSC_BRIDGE_SYNC_TOKEN" ] || [ -z "$GH_TOKEN" ]; then
            echo "OSC_BRIDGE_SYNC_TOKEN or CONTRIB_TOKEN is not set: nothing to do."
            echo "count=0" >> "$GITHUB_OUTPUT"; exit 0
          fi
          curl -fsS -H "Authorization: Bearer $OSC_BRIDGE_SYNC_TOKEN" \
            https://mcp.osc-bridge.roomi-fields.com/admin/contributions > "$RUNNER_TEMP/pending.json"
          echo "count=$(jq '.contributions | length' "$RUNNER_TEMP/pending.json")" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.fetch.outputs.count != '0'
        with:
          token: ${{ secrets.CONTRIB_TOKEN }}
          fetch-depth: 0

      - name: Install ALSA dev headers
        if: steps.fetch.outputs.count != '0'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - name: Build
        if: steps.fetch.outputs.count != '0'
        run: cargo build --release && cargo test --release --lib --no-run

      - name: Check and merge
        id: merge
        if: steps.fetch.outputs.count != '0'
        run: python3 scripts/apply_contributions.py "$RUNNER_TEMP/pending.json" --binary target/release/osc-bridge

      # The merges push to main, which rebuilds the site on its own; the
      # hosted catalogue is redeployed explicitly.
      - name: Redeploy the hosted catalogue
        if: steps.merge.outputs.merged != '' && steps.merge.outputs.merged != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
