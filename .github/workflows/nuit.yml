# Généré par `npx grillhouse maj` depuis le gabarit du cadre ; ne pas éditer : la mise à jour le réécrit. Un workflow sans cette ligne est au projet, et la mise à jour n'y touche pas.
#
# The night of a shared machine: once a night, on the default branch, the project's night tests but
# those that bear the tag @poste (a night test that depends on the poste: its envelope, its tools,
# its session; the frame's guard `tests-du-poste` asks for the tag), on Node 26. This flow declares
# no job that plays the measures of time (a command `tests-de-nuit --mesures`, which the night of
# the poste reads, scripts/flux-de-la-nuit.mjs): a shared machine does not measure a time (the
# frame's charter, « Une mesure de temps joue la nuit »), so the night of the poste plays them, on
# its dedicated cores, after the tests tagged @poste. A green run here is never the last green: the
# night of the poste alone keeps it, once the measures were played and are green.
name: Nuit

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

# One run at a time on the runner of the project for this repository, the CI of the day (ci.yml) and
# the night: a run that waits is never cancelled by the next one.
concurrency:
  group: pc2
  cancel-in-progress: false

# The night in n + 1 jobs per version of Node, as the CI plays the verification (ci.yml): each job
# of `tranches` plays its tranche of the night tests out of the poste (`grillhouse tests-de-nuit
# --hors-du-poste --tranche i/n`), and `fusion` merges the reports of the n tranches, which it
# refuses when a night test is missing or played twice. TRANCHES is n, and the matrix of `tranches`
# lists 1 to n: both change together.
env:
  TRANCHES: 3

# The machine of every job: the repository's variable RUNNER, as in ci.yml; GitHub's ubuntu-latest
# without it.

jobs:
  tranches:
    runs-on: ${{ fromJSON(vars.RUNNER || '"ubuntu-latest"') }}

    strategy:
      fail-fast: false
      matrix:
        node-version: ['26.x']
        tranche: [1, 2, 3]

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          # The submodules of the project, a private one read by the repository's secret SOUS_MODULES
          # (a token that reads it); without the secret, the workflow's own token.
          submodules: recursive
          token: ${{ secrets.SOUS_MODULES || github.token }}

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      # uv, which the frame's module python plays, for a project with packages of Python; a runner
      # of the repository brings its own.
      - name: Install uv
        if: runner.environment == 'github-hosted' && hashFiles('**/pyproject.toml') != ''
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: npm ci

      # The project's preparation (system packages, toolchains), when its package.json has the
      # script `ci:preparer`; it may export variables to the next steps through $GITHUB_ENV.
      - name: Prepare the project
        run: npm run --if-present ci:preparer

      # The binaries of the project's languages that the night tests run (cargo's sccache,
      # nextest and cargo-deny, python's uv), each at its version; none for TypeScript alone.
      - name: Install the binaries of the languages
        run: npx --no-install grillhouse binaires

      # The builds the night tests start, as the night of the poste has them from its complete pass.
      - name: Build
        run: npx --no-install turbo run build

      # The night tests of the tranche, but those tagged @poste and @equipee (the equipment of a
      # machine its default runner lacks), without any measure of time.
      - name: Night tests out of the poste, tranche ${{ matrix.tranche }}
        run: npx --no-install grillhouse tests-de-nuit --hors-du-poste --sans-equipement ${{ format('--tranche {0}/{1}', matrix.tranche, env.TRANCHES) }}

      # The reports of the tranche (Vitest's blob and the files of its part), red or green, which
      # the job fusion merges.
      - name: Reports of the tranche
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: nuit-${{ matrix.node-version }}-${{ matrix.tranche }}
          path: .vitest-reports/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  fusion:
    needs: tranches
    if: ${{ !cancelled() }}
    runs-on: ${{ fromJSON(vars.RUNNER || '"ubuntu-latest"') }}

    strategy:
      fail-fast: false
      matrix:
        node-version: ['26.x']

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # The submodules of the project, a private one read by the repository's secret SOUS_MODULES
          # (a token that reads it); without the secret, the workflow's own token.
          submodules: recursive
          token: ${{ secrets.SOUS_MODULES || github.token }}

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Reports of the tranches
        uses: actions/download-artifact@v4
        with:
          pattern: nuit-${{ matrix.node-version }}-*
          path: .vitest-reports
          merge-multiple: true

      # Each night test out of the poste played by one tranche exactly, then one report of the n
      # tranches.
      - name: Merge of the tranches
        run: npx --no-install grillhouse fusion-des-tranches
