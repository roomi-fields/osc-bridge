# Deploy the hosted MCP server (mcp.osc-bridge.roomi-fields.com).
#
# Builds the container image and hands it to the server's deploy account,
# whose forced command loads it, restarts the service and checks its health.
# The account only accepts `deploy` (image on stdin) and `logs`.
name: Deploy hosted MCP

on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: deploy-mcp
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t osc-bridge:latest .

      - name: Smoke test
        run: |
          docker run -d --name smoke -p 8080:8080 osc-bridge:latest --http 0.0.0.0:8080
          for i in $(seq 20); do curl -fs localhost:8080/healthz && break; sleep 1; done
          curl -fs -X POST localhost:8080/mcp -H 'content-type: application/json' \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' | grep -q list_devices
          docker rm -f smoke

      - name: Ship to the server
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          docker save osc-bridge:latest | gzip | ssh deploy-osc-bridge@82.112.242.140 deploy
