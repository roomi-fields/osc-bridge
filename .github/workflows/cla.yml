# Contributor License Agreement (CLA.md): asks each new contributor to sign
# once, by a comment on their pull request, and records the signatures on
# the `cla-signatures` branch. The maintainer and bots are exempt. Uses
# pull_request_target without checking out the pull request's code.
name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - if: >-
          github.event.comment.body == 'recheck' ||
          github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA' ||
          github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/v1/cla.json
          path-to-document: https://github.com/roomi-fields/osc-bridge/blob/main/CLA.md
          branch: cla-signatures
          allowlist: roomi-fields,dependabot[bot],github-actions[bot]
          custom-notsigned-prcomment: >-
            Thanks for your contribution! Before it can be merged, please sign our
            [Contributor License Agreement](https://github.com/roomi-fields/osc-bridge/blob/main/CLA.md)
            — once, it covers all your future contributions. In short: you keep your
            copyright, and the maintainer may also use your contribution in other
            programs and services built on osc-bridge. To sign, post the comment below.
