# osc-bridge's site and its device catalogue live at
# https://synthhub.roomi-fields.com/. GitHub Pages only publishes a page that
# points there.
name: Pages pointer

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Write the page
        run: |
          mkdir -p site
          cat > site/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>osc-bridge</title>
            <link rel="canonical" href="https://synthhub.roomi-fields.com/">
            <meta http-equiv="refresh" content="0; url=https://synthhub.roomi-fields.com/">
          </head>
          <body>
            <p>osc-bridge's documentation and its device catalogue are at
              <a href="https://synthhub.roomi-fields.com/">synthhub.roomi-fields.com</a>.</p>
          </body>
          </html>
          HTML
          cp site/index.html site/404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
