[package]
name = "osc-bridge"
version = "0.15.0"
edition = "2021"
description = "Declarative OSC ↔ MIDI/SysEx bridge for hardware synthesizers"
license = "AGPL-3.0-or-later"
repository = "https://github.com/roomi-fields/osc-bridge"

[dependencies]
midir = "0.10"
rosc = "0.11"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crossbeam-channel = "0.5"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
mlua = { version = "0.10", features = ["lua54", "vendored", "send"] }
toml = "0.8"
tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
ureq = { version = "3", default-features = false, features = ["rustls"] }
ring = "0.17"
base64 = "0.23"

[[bin]]
name = "osc-bridge"
path = "src/main.rs"

[lib]
name = "osc_bridge"
path = "src/lib.rs"

[profile.release]
lto = true
strip = true

[dev-dependencies]
tiny_http = "0.12"
pretty_assertions = "1"
