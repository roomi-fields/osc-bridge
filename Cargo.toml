[package]
name = "osc-bridge"
version = "0.12.0"
edition = "2021"
description = "Declarative OSC ↔ MIDI/SysEx bridge for hardware synthesizers"
license = "GPL-3.0-or-later"
repository = "https://github.com/roomi-fields/osc-bridge"

[dependencies]
midir = "0.10"
rosc = "0.11"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crossbeam-channel = "0.5"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
mlua = { version = "0.10", features = ["lua54", "vendored", "send"] }
toml = "0.8"
tungstenite = "0.30.0"

[[bin]]
name = "osc-bridge"
path = "src/main.rs"

[lib]
name = "osc_bridge"
path = "src/lib.rs"

[profile.release]
lto = true
strip = true

[dev-dependencies]
pretty_assertions = "1"
