[workspace]
# A virtual workspace: the application and its libraries live under crates/,
# each listed here when it gets its Cargo.toml (a glob would refuse the
# directories that hold only their docs/).
members = ["crates/osc-bridge"]
resolver = "2"

[workspace.package]
version = "0.19.1"
edition = "2021"
license = "AGPL-3.0-or-later"
# Not published on crates.io: the application ships as release binaries and an npm wrapper.
publish = false
repository = "https://github.com/roomi-fields/osc-bridge"

[workspace.dependencies]
midir = "0.10"
rosc = "0.11"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crossbeam-channel = "0.5"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
mlua = { version = "0.10", features = ["lua54", "vendored", "send"] }
toml = "0.8"
tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
ureq = { version = "3", default-features = false, features = ["rustls"] }
ring = "0.17"
base64 = "0.23"
tiny_http = "0.12"
pretty_assertions = "1"
roxmltree = "0.20"
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "deny"

# Cargo reads profiles from the workspace root only.
[profile.release]
lto = true
strip = true
