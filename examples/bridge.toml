# Example orchestrator config for osc-bridge.
# Run with:  osc-bridge orchestrate --config examples/bridge.toml

[osc]
# Inbound OSC (clients send performance/config here).
bind = "127.0.0.1:7777"
# Outbound broadcast — every event is copied to all listed clients.
# Leave empty for fire-and-forget setups that don't need feedback.
clients = ["127.0.0.1:8888"]
# Optional WebSocket listener for browser clients. Binary WS frames carry
# raw OSC packets; each connected client acts as an extra `clients` entry.
# ws_bind = "127.0.0.1:7890"
# Browser pages from other sites than localhost are refused; list the ones
# you trust ("null" for file:// pages, "*" for any).
# ws_allow_origins = ["https://example.org"]
# Optional OSCQuery listener (HTTP): GET / gives every device's OSC namespace.
# oscquery_bind = "127.0.0.1:7891"

# spec: a driver file, or a catalogue id or slug (fetched from the SynthHub
# server once, then kept in the cache; offline, the cached copy).
[[devices]]
spec          = "moog/subsequent-37"
midi_out_port = 3
midi_in_port  = 2
# osc_prefix: inherited from the JSON (/sub37 here) unless overridden.

[[devices]]
spec          = "polyend/synth"
midi_out_port = 5
midi_in_port  = 4

# Two MatrixBrutes in the same rig — give them distinct OSC prefixes.
# [[devices]]
# spec          = "arturia/matrixbrute"
# osc_prefix    = "/matrixbrute-1"
# midi_out_port = 7
# midi_in_port  = 6
#
# [[devices]]
# spec          = "arturia/matrixbrute"
# osc_prefix    = "/matrixbrute-2"
# midi_out_port = 9
# midi_in_port  = 8
