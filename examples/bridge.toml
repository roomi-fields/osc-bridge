# Example orchestrator config for osc-bridge.
# Run with:  osc-bridge orchestrate --config examples/bridge.toml

[osc]
# Inbound OSC (clients send performance/config here).
bind = "127.0.0.1:7777"
# Outbound broadcast — every event is copied to all listed clients.
# Leave empty for fire-and-forget setups that don't need feedback.
clients = ["127.0.0.1:8888"]
# Optional WebSocket listener for browser clients. Binary WS frames carry
# raw OSC packets; each connected client acts as an extra `clients` entry.
# ws_bind = "127.0.0.1:7890"

[[devices]]
spec          = "devices/moog/subsequent-37.json"
midi_out_port = 3
midi_in_port  = 2
# osc_prefix: inherited from the JSON (/sub37 here) unless overridden.

[[devices]]
spec          = "devices/polyend/synth.json"
midi_out_port = 5
midi_in_port  = 4

